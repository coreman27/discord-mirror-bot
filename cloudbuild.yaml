steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/discord-mirror', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/discord-mirror']

  # Deploy container to Cloud Run
  # Note: We use --no-allow-unauthenticated because this isn't a web server
  # We use --min-instances 1 to keep it running (Discord bots need to stay connected)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'discord-mirror'
      - '--image'
      - 'gcr.io/$PROJECT_ID/discord-mirror'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--min-instances'
      - '1'
      - '--memory'
      - '512Mi'
      - '--service-account'
      - 'discord-mirror-bot@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-secrets'
      - 'DISCORD_TOKEN=discord-token:latest,SOURCE_CHANNEL_ID=discord-source-channel:latest,DESTINATION_CHANNEL_ID=discord-dest-channel:latest'

images:
  - 'gcr.io/$PROJECT_ID/discord-mirror'
